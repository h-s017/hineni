<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>旗袍合作｜可配合日曆</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#343a3b;background:#f5f5f2}*{box-sizing:border-box}body{margin:0;padding:24px 12px}main{max-width:980px;margin:auto}h1{font-size:clamp(23px,4vw,34px);letter-spacing:.08em;font-weight:600;margin:0 0 9px}.sub{color:#777e7e;font-size:14px;line-height:1.8;margin:0 0 20px}.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:16px}.months,.filters{display:flex;gap:6px;flex-wrap:wrap}button{font:inherit;border:1px solid #dadeda;border-radius:8px;padding:9px 14px;background:#fff;color:#3d4645;cursor:pointer}button[aria-pressed=true]{background:#344845;color:#fff;border-color:#344845}.calendar{background:#fff;padding:14px;border:1px solid #e6e8e5;border-radius:13px}.heading{font-size:20px;letter-spacing:.05em;margin:5px 5px 13px} .week,.cells{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.week div{text-align:center;padding:8px 0;color:#858b8b;font-size:13px}.day{border:1px solid #e9ece8;border-radius:7px;min-height:104px;padding:9px 6px}.day.blank{background:#f8f9f7;border-color:transparent}.num{display:block;font-size:13px;color:#656d6b;margin:0 0 9px}.tag{display:block;font-size:12px;line-height:1.4;border-radius:5px;padding:6px;text-align:center;overflow-wrap:anywhere}.tag.type0{background:#e7f0f5;color:#344d60}.tag.type1{background:#e8f1e9;color:#35624d}.tag.type2{background:#efe8f4;color:#614a75}.foot{color:#78807d;font-size:13px;line-height:1.7;margin:16px 4px} .legend{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.legend .tag{padding:7px 10px} @media(max-width:600px){body{padding:20px 8px}.calendar{padding:7px}.day{min-height:83px;padding:5px 2px}.cells,.week{gap:2px}.tag{font-size:10px;padding:5px 2px}.num{font-size:12px;margin-bottom:6px}.tools{display:block}.filters{margin-top:9px}button{padding:8px 10px;font-size:13px}}
</style></head><body><main><h1>旗袍合作｜可配合日曆</h1><p class="sub">2026 年 12 月－2027 年 1 月｜三種合作組合的共同可配合日期<br>本頁為內部合作排程參考，不代表活動已正式開放報名。</p><div class="tools"><div class="months"><button id="m12" aria-pressed="true" onclick="chooseMonth(11)">2026 年 12 月</button><button id="m01" aria-pressed="false" onclick="chooseMonth(0)">2027 年 1 月</button></div><div class="filters"><button data-filter="-1" aria-pressed="true" onclick="chooseFilter(-1)">全部組合</button><button data-filter="0" aria-pressed="false" onclick="chooseFilter(0)">旗袍＋攝影</button><button data-filter="1" aria-pressed="false" onclick="chooseFilter(1)">旗袍＋調香</button><button data-filter="2" aria-pressed="false" onclick="chooseFilter(2)">三方合作</button></div></div><div class="calendar"><h2 id="heading" class="heading"></h2><div class="week"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div><div id="cells" class="cells"></div></div><div class="legend"><span class="tag type0">旗袍＋攝影</span><span class="tag type1">旗袍＋調香</span><span class="tag type2">旗袍＋攝影＋調香</span></div><p class="foot">未標示日期表示目前沒有符合所選合作組合的共同可配合時段。資料依合作統計表整理；資料若更新，需同步更新本頁。此連結不收集個人資料，也不提供投票或編輯功能。</p></main>
<script>
const availability={"2026-12-05":0,"2026-12-06":2,"2026-12-11":1,"2026-12-17":1,"2026-12-18":2,"2026-12-20":2,"2026-12-24":1,"2026-12-30":2,"2027-01-04":1,"2027-01-05":2,"2027-01-10":2,"2027-01-16":0,"2027-01-17":2,"2027-01-22":1,"2027-01-29":2};
const labels=["旗袍＋攝影","旗袍＋調香","旗袍＋攝影＋調香"];
let month=11,filter=-1;
function chooseMonth(m){month=m;render()}
function chooseFilter(f){filter=f;render()}
function render(){const year=month===11?2026:2027;document.getElementById("heading").textContent=year+" 年 "+(month+1)+" 月";document.querySelector("#m12").setAttribute("aria-pressed",String(month===11));document.querySelector("#m01").setAttribute("aria-pressed",String(month===0));document.querySelectorAll("[data-filter]").forEach(b=>b.setAttribute("aria-pressed",String(Number(b.dataset.filter)===filter)));const first=new Date(year,month,1).getDay(),days=new Date(year,month+1,0).getDate(),container=document.getElementById("cells");container.replaceChildren();for(let i=0;i<Math.ceil((first+days)/7)*7;i++){const cell=document.createElement("div");cell.className="day";const d=i-first+1;if(d<1||d>days){cell.classList.add("blank");cell.setAttribute("aria-hidden","true")}else{const num=document.createElement("span");num.className="num";num.textContent=d;cell.append(num);const key=year+"-"+String(month+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");const kind=availability[key];if(kind!==undefined&&(filter===-1||filter===kind)){const tag=document.createElement("span");tag.className="tag type"+kind;tag.textContent=labels[kind];cell.append(tag)}}container.append(cell)}}
render();
</script></body></html>
