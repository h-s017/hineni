name: Deploy Hineni

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Hineni config
        uses: actions/checkout@v4

      - name: Build Hineni site from HANA source
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/h-s017/official_site.git source
          mkdir -p _site
          cp -R source/ciyu/. _site/
          cp -R source/assets _site/assets
          printf 'hineni.hanascent.com\n' > _site/CNAME

          # Migrate canonical URLs and structured-data identifiers to the new site.
          find _site -type f -name '*.html' -print0 | xargs -0 sed -i \
            -e 's#https://hanascent.com/ciyu/programs/#https://hineni.hanascent.com/programs/#g' \
            -e 's#https://hanascent.com/ciyu/#https://hineni.hanascent.com/#g' \
            -e 's#href="/ciyu/programs/"#href="/programs/"#g' \
            -e 's#href="/ciyu/"#href="/"#g'

          # Hineni is its own site-level entity on the subdomain.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('_site/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('"isPartOf": { "@id": "https://hanascent.com/#website" },', '"isPartOf": { "@id": "https://hineni.hanascent.com/#website" },')
          marker = '<!-- HANA_SCHEMA:START -->'
          website = '''<script type="application/ld+json">\n{\n  "@context": "https://schema.org",\n  "@type": "WebSite",\n  "@id": "https://hineni.hanascent.com/#website",\n  "url": "https://hineni.hanascent.com/",\n  "name": "此域 Hineni",\n  "alternateName": ["Hineni", "此域"]\n}\n</script>\n'''
          if website not in s:
              s = s.replace(marker, website + marker)
          p.write_text(s, encoding='utf-8')
          PY

          cat > _site/robots.txt <<'EOF'
          User-agent: *
          Allow: /
          Sitemap: https://hineni.hanascent.com/sitemap.xml
          EOF

          cat > _site/sitemap.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url><loc>https://hineni.hanascent.com/</loc></url>
            <url><loc>https://hineni.hanascent.com/programs/</loc></url>
          </urlset>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
